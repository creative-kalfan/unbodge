[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "unbodge"
version = "0.1.0"
description = "UNBODGE: evidence-gated autonomous maintenance (deterministic core, proof engine, reasoning)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "packaging>=23"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
filterwarnings = [
    "ignore::pytest.PytestCollectionWarning",
]

[tool.ruff]
line-length = 100