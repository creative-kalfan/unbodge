# UNBODGE CI (Phase 4). No private credentials required anywhere:
# credential-dependent tests are isolated and skip explicitly.

name: ci

on:
  push:
  pull_request:

jobs:
  tests:
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" fastapi httpx uvicorn psycopg2-binary redis
      - name: Dependency audit
        run: pip-audit --desc || echo "pip-audit unavailable offline; review manually"
      - name: Unit, integration (deterministic) and security tests
        run: python -m pytest -q
        env:
          PYTHONPATH: packages
